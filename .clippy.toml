# .clippy.toml — project-level Clippy configuration.
# Production paths must not use unwrap/expect; enforced via #![deny(clippy::unwrap_used, clippy::expect_used)]
# in each module.

# Cognitive complexity threshold (default 25).
cognitive-complexity-threshold = 20

# Minimum function line count before too-many-lines fires.
too-many-lines-threshold = 80
